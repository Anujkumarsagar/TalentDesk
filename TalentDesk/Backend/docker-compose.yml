services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentdesk
      POSTGRES_PASSWORD: talentdesk
      POSTGRES_DB: talentdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentdesk -d talentdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    command: sh -c "npm run db:deploy && npm run start"
    environment:
      DATABASE_URL: postgresql://talentdesk:talentdesk@postgres:5432/talentdesk?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-before-deploying}
      JWT_EXPIRES_IN: 7d
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
      EMBEDDING_MODEL: text-embedding-004
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 10
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  worker:
    build: .
    restart: unless-stopped
    command: npm run start:worker
    environment:
      DATABASE_URL: postgresql://talentdesk:talentdesk@postgres:5432/talentdesk?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-before-deploying}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
      EMBEDDING_MODEL: text-embedding-004
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
